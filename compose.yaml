services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_resto
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: app_resto_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_resto -d app_resto_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
